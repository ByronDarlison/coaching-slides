name: visual-regression

on:
  push:
    branches: [main]
    paths:
      - 'monthly/**/index.html'
      - 'eoa/**/index.html'
      - 'build_slideshows.py'
      - 'build_new_slideshows.py'
      - 'tests/visual/**'
      - 'scripts/eoa_shared_slides.py'
      - '.github/workflows/visual-regression.yml'
  pull_request:
    paths:
      - 'monthly/**/index.html'
      - 'eoa/**/index.html'
      - 'build_slideshows.py'
      - 'build_new_slideshows.py'
      - 'tests/visual/**'
      - 'scripts/eoa_shared_slides.py'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: tests/visual/package.json
      - name: Install dependencies
        working-directory: tests/visual
        run: npm install
      - name: Install Chromium
        working-directory: tests/visual
        run: npx playwright install --with-deps chromium

      - name: Run visual regression
        id: test
        working-directory: tests/visual
        run: node visual-regression.js
        continue-on-error: true

      - name: Upload diffs on failure
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: tests/visual/diffs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail on visual regression
        if: steps.test.outcome == 'failure'
        run: |
          echo "Visual regression failed against the current baselines."
          echo "If this layout change is intentional, run the"
          echo "visual-baseline workflow manually to refresh baselines."
          exit 1
