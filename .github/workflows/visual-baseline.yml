name: visual-baseline

# Manually-triggered workflow that captures fresh visual baselines on
# Linux (the same environment CI runs in), then commits them back to
# main. Use this after an intentional layout change when the local
# macOS baselines would diverge from CI's Linux rendering.
#
# Trigger via: gh workflow run visual-baseline.yml
# Or from the GitHub Actions UI "Run workflow" button.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/visual/package.json
      - name: Install dependencies
        working-directory: tests/visual
        run: npm install
      - name: Install Chromium
        working-directory: tests/visual
        run: npx playwright install --with-deps chromium
      - name: Capture baselines
        working-directory: tests/visual
        run: node visual-regression.js --update-baseline
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/baselines/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh visual baselines from Linux CI"
          git push
