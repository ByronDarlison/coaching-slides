name: visual-baseline

# Capture reviewable Linux screenshots. Repository writes remain explicit:
# download the artifact, inspect the differences, then commit selected files.
on:
  workflow_dispatch:
    inputs:
      decks:
        description: 'Space-separated deck paths to capture'
        required: true
        default: 'eoa/meeting-4'
        type: string

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/visual/package-lock.json
      - name: Install dependencies
        working-directory: tests/visual
        run: npm ci
      - name: Install Chromium
        working-directory: tests/visual
        run: npx playwright install --with-deps chromium
      - name: Capture selected baselines
        working-directory: tests/visual
        env:
          DECKS: ${{ inputs.decks }}
        run: |
          read -r -a decks <<< "$DECKS"
          test "${#decks[@]}" -gt 0
          for deck in "${decks[@]}"; do
            node visual-regression.js --update-baseline --deck "$deck"
          done
      - name: Upload baseline candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-candidates
          path: tests/visual/baselines/
          if-no-files-found: error
          retention-days: 14
