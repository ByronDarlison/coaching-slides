name: narrated-video

# Builds a narrated video for every changed deck with speaker notes and
# delivers it to Byron's private Drive folder through the narrated-video
# broker (Work Card ai-config#1382). Never runs on pull requests: the caller
# key lives in the main-only `narration` environment.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'tests/**']
  workflow_dispatch:
    inputs:
      deck:
        description: 'One deck path (for example eoa/meeting-4), or empty for all'
        required: false
        default: ''
        type: string
      mode:
        description: 'normal, rehearse (no speech or upload) or cap_probe (expects a refusal at cap 0)'
        required: true
        default: normal
        type: choice
        options: [normal, rehearse, cap_probe]

permissions:
  contents: read

concurrency:
  group: narrated-video
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    environment: narration
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
      - name: Install capture and video tools
        working-directory: scripts/narrated-video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium-headless-shell > /dev/null
      - name: Build and deliver narrated videos
        env:
          NARRATION_BROKER_URL: https://narrated-video-broker.byron-740.workers.dev
          NARRATION_BROKER_KEY: ${{ secrets.NARRATION_BROKER_KEY }}
          NARRATION_DECK: ${{ inputs.deck }}
          NARRATION_MODE: ${{ inputs.mode }}
        run: python3 scripts/narrated-video/run.py
