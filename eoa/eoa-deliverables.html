function Cell({ value }) {
  if (!value) return <td style={styles.cell}></td>;
  let content;
  if (value === "new") content = <span style={{ color: "#326AB5", fontSize: 14, fontWeight: 700, lineHeight: 1 }}>{"\u2605"}</span>;
  else if (value === "finalise") content = <span style={{ color: "#54B570", fontSize: 14, fontWeight: 700, lineHeight: 1 }}>{"\u25B2"}</span>;
  else if (value === "rebuild") content = <span style={{ color: "#326AB5", fontSize: 14, fontWeight: 900, lineHeight: 1 }}>{"\u25FC"}</span>;
  else content = <span style={{ color: "#999", fontSize: 14, fontWeight: 400, lineHeight: 1 }}>{"\u2713"}</span>;
  return <td style={styles.cell}>{content}</td>;
}

function EOASchedule() {
  const [hoveredRow, setHoveredRow] = useState(null);

  return (

        </div>

        <p style={styles.introText}></p>

                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {DELIVERABLES.map((d, ri) => {
              const isHovered = hoveredRow === ri;
              return (
                <tr key={ri}
                  style={{ backgroundColor: isHovered ? "#f5f7fa" : "transparent", transition: "background-color 0.12s" }}
                  onMouseEnter={() => setHoveredRow(ri)}
                  onMouseLeave={() => setHoveredRow(null)}
                  title={d.note}>
                  <td style={{...styles.nameCell, ...(d.learningDay ? {fontStyle: "italic", color: "#999"} : {})}}>

                      <a href={d.url} target="_blank" rel="noopener noreferrer" style={styles.nameLink}>{d.name} <span style={styles.linkIcon}>{"\u2197"}</span></a>
                    ) : (
                      <span style={d.learningDay ? {...styles.nameText, color: "#999", fontStyle: "italic"} : styles.nameText}>{d.name}</span>
