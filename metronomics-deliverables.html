function Cell({ value }) {
  if (!value) return <td style={styles.cell}></td>;
  const cfg = STATUS_TYPES[value];
  if (!cfg) return <td style={styles.cell}></td>;
  let content;
  if (value === "new") content = <span style={{ color: cfg.color, fontSize: cfg.size, fontWeight: 700, lineHeight: 1 }}>{"\u2605"}</span>;
  else if (value === "finalise") content = <span style={{ color: cfg.color, fontSize: cfg.size, fontWeight: 700, lineHeight: 1 }}>{"\u25B2"}</span>;
  else if (value === "rebuild") content = <span style={{ color: cfg.color, fontSize: cfg.size, fontWeight: 900, lineHeight: 1 }}>{"\u25FC"}</span>;
  else content = <span style={{ color: "#999", fontSize: 14, fontWeight: 400, lineHeight: 1 }}>{"\u2713"}</span>;
  return <td style={styles.cell}>{content}</td>;
}

function MetronomicsSequence() {
  const urlView = new URLSearchParams(window.location.search).get("view");
  const [view, setViewState] = useState(urlView === "monthly" ? "monthly" : "quarterly");
  const setView = (v) => {
    setViewState(v);
    const url = new URL(window.location);
    url.searchParams.set("view", v);
    window.history.replaceState({}, "", url);
  };
  const [hoveredRow, setHoveredRow] = useState(null);
  const viewCfg = VIEWS[view];

  const filtered = useMemo(() => {
    return [...DELIVERABLES].sort((a, b) => {
      const aIdx = (a[view] || a.monthly).indexOf("new");
      const bIdx = (b[view] || b.monthly).indexOf("new");
      if (aIdx === -1 && bIdx === -1) return 0;
      if (aIdx === -1) return 1;
      if (bIdx === -1) return -1;
      return aIdx - bIdx;
    });
  }, [view]);

  return (
    <div style={styles.page}>
      <div style={styles.topSection}>
        <div style={styles.titleRow}>
          <div>
            <h1 style={styles.title}>Metronomics Coaching Deliverables</h1>
            <p style={styles.byline}>Byron Darlison {"\u00B7"} Metronomics Coach {"\u00B7"} <a href="https://www.darlison.com" target="_blank" rel="noopener noreferrer" style={styles.bylineLink}>darlison.com</a></p>
          </div>
          <div style={styles.viewToggle}>
            <button onClick={() => setView("monthly")} style={view === "monthly" ? styles.viewActive : styles.viewBtn}>Monthly Coaching</button>
            <button onClick={() => setView("quarterly")} style={view === "quarterly" ? styles.viewActive : styles.viewBtn}>Quarterly Coaching</button>
          </div>
        </div>

        <p style={styles.introText}>Most founders run their business without a system. Metronomics connects strategy, execution, cash, and team into one plan. One quarter at a time. The table below shows every deliverable, the order they're introduced, and how they evolve over a full coaching engagement.</p>

        <div style={styles.legend}>
          {Object.entries(STATUS_TYPES).map(([key, cfg]) => (
            <span key={key} style={styles.legendItem} title={cfg.tip}>
              <span style={{ color: cfg.color, fontSize: 14, fontWeight: 700, marginRight: 4, lineHeight: 1 }}>
                {key === "new" ? "\u2605" : key === "finalise" ? "\u25B2" : key === "rebuild" ? "\u25FC" : "\u2713"}
              </span>
              <span>{cfg.label}</span>
            </span>
          ))}
        </div>
      </div>

      <div style={styles.tableWrap}>
        <table style={styles.table}>
          <thead>
            <tr>
              <th style={styles.stickyHeaderName}>Deliverable</th>
              {viewCfg.labels.map((q, i) => {
                const slideUrl = (SLIDESHOW_URLS[view] || {})[i];
                return (
                <th key={i} style={{
                  ...styles.th,
                  backgroundColor: viewCfg.kickoffCol === i ? "#f0f4f8" : viewCfg.annualCols.includes(i) ? "#fdf6ec" : "#f5f7fa",
                }}>{slideUrl ? (
                  <a href={slideUrl} target="_blank" rel="noopener noreferrer" style={{ color: "#326AB5", textDecoration: "none", borderBottom: "1.5px solid #326AB5", paddingBottom: 1 }} title="View slideshow">{q}</a>
                ) : q}</th>
                );
              })}
            </tr>
          </thead>
          <tbody>
            {filtered.map((d, ri) => {
              const isHovered = hoveredRow === ri;
              return (
                <tr key={ri}
                  style={{ backgroundColor: isHovered ? "#f5f7fa" : "transparent", transition: "background-color 0.12s" }}
                  onMouseEnter={() => setHoveredRow(ri)}
                  onMouseLeave={() => setHoveredRow(null)}
                  title={d.note}>
                  <td style={styles.nameCell}>
                    {d.url ? (
                      <a href={d.url} target="_blank" rel="noopener noreferrer" style={styles.nameLink}>{d.name} <span style={styles.linkIcon}>{"\u2197"}</span></a>
                    ) : (
                      <span style={styles.nameText}>{d.name}</span>
                    )}
                    {d.promptUrl && (
                      <a href={d.promptUrl} target="_blank" rel="noopener noreferrer" style={styles.sparklePill}>
                        <span style={styles.sparkleIcon}>{"\u2726"}</span> AI Prompt
                      </a>
                    )}
                  </td>
                  {(d[view] || d.monthly).map((val, ci) => (
                    <Cell key={ci} value={val} />
                  ))}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div style={styles.bottomBar}>
        <div style={styles.notes}>
          {hoveredRow !== null && filtered[hoveredRow] ? (
            <p style={styles.noteText}>
              <strong>{filtered[hoveredRow].name}:</strong> {filtered[hoveredRow].note}
            </p>
          ) : filtered[0] ? (
            <p style={styles.noteText}>
              <strong>{filtered[0].name}:</strong> {filtered[0].note}
            </p>
          ) : null}
        </div>
        <p style={styles.footerText}>Based on the Metronomics system created by Shannon Susko. A few deliverables and sequencing adjustments here reflect how I coach the program. The core frameworks and thinking are hers. If you're serious about scaling a company, start with her books: <em>Metronomics</em> and <em>3HAG WAY</em>.</p>
      </div>
    </div>
  );
}

const styles = {
  page: { fontFamily: "'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif", display: "flex", flexDirection: "column", height: "100vh", color: "#1a1a1a", overflow: "hidden" },
  topSection: { padding: "14px 14px 0 14px", flexShrink: 0 },
  titleRow: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10 },
  title: { fontSize: 18, fontWeight: 700, margin: 0, color: "#326AB5", letterSpacing: "-0.3px" },
  byline: { fontSize: 12, color: "#666", margin: "4px 0 0 0", fontWeight: 400 },
  bylineLink: { color: "#326AB5", textDecoration: "none", borderBottom: "1px dotted #326AB5" },
  introText: { fontSize: 14, color: "#1a1a1a", margin: "6px 0 12px 0", lineHeight: 1.7 },
  viewToggle: { display: "flex", gap: 6, alignItems: "center" },
  viewBtn: { padding: "5px 14px", fontSize: 12, fontWeight: 600, border: "1.5px solid #ccc", borderRadius: 4, backgroundColor: "transparent", cursor: "pointer", color: "#555" },
  viewActive: { padding: "5px 14px", fontSize: 12, fontWeight: 600, border: "1.5px solid #326AB5", borderRadius: 4, backgroundColor: "#326AB5", color: "#fff", cursor: "pointer" },
  legend: { display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 4, alignItems: "center" },
  legendItem: { display: "inline-flex", alignItems: "center", fontSize: 11, color: "#555", whiteSpace: "nowrap" },
  tableWrap: { flex: 1, overflow: "auto", margin: "8px 14px 0 14px", border: "1px solid #e0e0e0", borderRadius: 6 },
  table: { borderCollapse: "collapse", width: "100%", minWidth: 1200, fontSize: 12 },
  stickyHeaderName: { position: "sticky", top: 0, left: 0, zIndex: 12, backgroundColor: "#f5f7fa", padding: "7px 10px", textAlign: "left", fontWeight: 700, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.5px", color: "#444", borderBottom: "2px solid #ddd", minWidth: 210 },
  th: { position: "sticky", top: 0, zIndex: 10, padding: "7px 4px", textAlign: "center", fontWeight: 700, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.3px", color: "#555", borderBottom: "2px solid #ddd", whiteSpace: "nowrap", minWidth: 40, backgroundColor: "#f5f7fa" },
  nameCell: { position: "sticky", left: 0, zIndex: 5, backgroundColor: "inherit", padding: "7px 8px", borderBottom: "1px solid #eee", display: "flex", alignItems: "center", gap: 6, minWidth: 210, whiteSpace: "nowrap" },
  nameText: { fontSize: 12, fontWeight: 500, color: "#1a1a1a" },
  nameLink: { fontSize: 12, fontWeight: 500, color: "#326AB5", textDecoration: "none", borderBottom: "1px dotted #326AB5" },
  linkIcon: { fontSize: 11, color: "#326AB5", marginLeft: 3, opacity: 0.6 },
  sparklePill: { display: "inline-flex", alignItems: "center", gap: 3, fontSize: 10, fontWeight: 600, color: "#7aba8a", backgroundColor: "#f5faf6", border: "1px solid #dceee0", borderRadius: 3, padding: "1px 6px", marginLeft: 6, textDecoration: "none", cursor: "pointer", whiteSpace: "nowrap" },
  sparkleIcon: { fontSize: 11 },
  cell: { padding: "7px 4px", textAlign: "center", borderBottom: "1px solid #eee", verticalAlign: "middle" },
  bottomBar: { flexShrink: 0, padding: "8px 14px 10px 14px", borderTop: "1px solid #e0e0e0", backgroundColor: "#fff" },
  notes: { minHeight: 32, padding: "6px 10px", backgroundColor: "#f8f9fa", borderRadius: 5, border: "1px solid #e8e8e8", marginBottom: 6 },
  noteText: { fontSize: 12, color: "#333", margin: 0, lineHeight: 1.5 },
  footerText: { fontSize: 11, color: "#1a1a1a", margin: 0, lineHeight: 1.5 },
};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<MetronomicsSequence />);
  </script>
